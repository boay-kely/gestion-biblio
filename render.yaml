# Blueprint Render — service aligné sur le dépôt GitHub « gestion-biblio »
services:
  - type: web
    name: gestion-biblio
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn --chdir backend core.wsgi:application
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-biblio-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: gestion-biblio.onrender.com,gestion-biblio,.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://gestion-biblio.onrender.com

databases:
  - name: gestion-biblio-db
    plan: free
    databaseName: bibliotheque
    user: biblio
