{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Gestion Biblio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-body">
  <div class="auth-layout">
    <section class="auth-panel">
      <p class="auth-brand">Gestion Biblio</p>
      <h1>Connexion</h1>
      <p class="auth-lead">Accédez au catalogue, aux membres et aux emprunts.</p>
      <form id="login-form" class="auth-form" autocomplete="on">
        <label>
          Nom d'utilisateur
          <input type="text" name="username" id="username" required autofocus>
        </label>
        <label>
          Mot de passe
          <input type="password" name="password" id="password" required>
        </label>
        <p id="login-error" class="form-error hidden"></p>
        <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      </form>
      <p class="auth-alt">Pas de compte ? <a href="{% url 'register' %}">S'inscrire</a></p>
    </section>
    <aside class="auth-visual" aria-hidden="true">
      <div class="auth-visual-inner">
        <h2>Votre bibliothèque,<br>simplifiée.</h2>
        <p>Livres, adhérents et emprunts — une interface légère en JavaScript pur.</p>
      </div>
    </aside>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
